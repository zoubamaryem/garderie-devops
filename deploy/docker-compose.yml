services:

  backend:
    image: maryem102/garderie-backend:latest
    container_name: garderie-backend

    ports:
      - "5000:5000"

    networks:
      - garderie-net

  frontend:
    image: maryem102/garderie-frontend:latest
    container_name: garderie-frontend

    environment:
      - API_URL=http://backend:5000

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge