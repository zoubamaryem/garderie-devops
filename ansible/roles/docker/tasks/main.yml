---
- name: Install Docker
  apt:
    name: docker.io
    state: present
    update_cache: yes

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Install Docker Compose Plugin
  apt:
    name: docker-compose-plugin
    state: present

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: yes